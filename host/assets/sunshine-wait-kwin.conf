# DeckScreen — drop-in para o serviço do Sunshine (KDE Plasma).
# Faz o Sunshine esperar o KWin subir antes de criar mouse/controle virtuais,
# evitando o bug "o cursor mexe mas o clique não funciona" após o boot.
# (Ideia do projeto Sunveil: github.com/ImStillBlue/sunshine-virtual-display)
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/env bash -c 'for i in $(seq 1 60); do pgrep -x kwin_wayland >/dev/null && exit 0; sleep 0.5; done; exit 0'
